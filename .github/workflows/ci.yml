name: native DSP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: native-dsp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
        shared: [ON, OFF]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBF_BUILD_SHARED=${{ matrix.shared }}
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix "${{ github.workspace }}/installed"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/installed/bin"
      - run: cmake -S tests/consumer -B consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/installed"
      - run: cmake --build consumer --config Release --parallel
      - run: ctest --test-dir consumer -C Release --output-on-failure
      - run: cmake -S examples/pcm-pipeline -B pcm-consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/installed"
      - run: cmake --build pcm-consumer --config Release --parallel
      - run: ctest --test-dir pcm-consumer -C Release --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DBF_WITH_SPEEXDSP=ON -DBF_SANITIZER=${{ matrix.sanitizer }}
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  aec-installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        shared: [ON, OFF]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBF_WITH_SPEEXDSP=ON -DBF_BUILD_SHARED=${{ matrix.shared }}
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: cmake --install build --config Release --prefix "${{ github.workspace }}/installed"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/installed/bin"
      - run: cmake -S tests/consumer -B consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/installed"
      - run: cmake --build consumer --config Release --parallel
      - run: ctest --test-dir consumer -C Release --output-on-failure
  hail-public-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: artalis-io/hail
          ref: 7ef6142ba4b8c8be15d1e7d704502db01abc5113
          path: hail-source
      - if: runner.os != 'Windows'
        run: cmake -S hail-source -B hail-build -DCMAKE_BUILD_TYPE=Release -DHA_BUILD_TESTS=OFF -DHA_BUILD_EXAMPLES=OFF -DHA_BACKEND_ALSA=OFF -DHA_BACKEND_PIPEWIRE=OFF
      - if: runner.os == 'Windows'
        run: cmake -S hail-source -B hail-build -DHA_BUILD_TESTS=OFF -DHA_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS=/experimental:c11atomics
      - run: cmake --build hail-build --config Release --parallel
      - run: cmake --install hail-build --config Release --prefix "${{ github.workspace }}/installed"
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBF_WITH_HAIL=ON -DBF_WITH_SPEEXDSP=ON -DCMAKE_PREFIX_PATH="${{ github.workspace }}/installed"
      - run: cmake --build build --config Release --parallel
      - run: cmake --install build --config Release --prefix "${{ github.workspace }}/installed"
      - run: cmake -S examples/hail-consumer -B consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/installed"
      - run: cmake --build consumer --config Release --parallel
      - run: ctest --test-dir consumer -C Release --output-on-failure
  fuzz-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBF_BUILD_FUZZER=ON -DBF_BUILD_TESTS=OFF -DBF_BUILD_BENCHMARKS=OFF
      - run: cmake --build build --parallel
      - run: python3 tools/fuzz_corpus.py build/corpus
      - run: build/baffle_fuzz_transport build/corpus/transport -runs=30000 -max_len=4096 -seed=721
      - run: build/baffle_fuzz_pipeline build/corpus/pipeline -runs=30000 -max_len=4096 -seed=722
      - run: cmake -S . -B analysis -DCMAKE_C_COMPILER=gcc -DBF_BUILD_TESTS=OFF -DCMAKE_C_FLAGS=-fanalyzer
      - run: cmake --build analysis --parallel
